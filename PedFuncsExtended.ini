[Settings]
; Write PedFuncsExtended.log next to PedFuncsExtended.asi (1 = on, 0 = off)
UseLog = 1

; 1 = errors, 2 = + warnings, 3 = + info (model loads, discovered drawables/textures),
; 4 = + debug (every ped spawn with its chosen drawables/textures, missing XML lookups)
LogLevel = 4

; GTA V NPC Model and Texture Variation System
; Automatically discovers 12 component slots (head, berd, hair, uppr, lowr, hand, feet, teef, accs, task, decl, jbib)
; and prop anchors (p_head, p_eyes, p_ears, p_lwrist, p_rwrist) from DFF/TXD and YMT XML files.
EnableGtaVVariations = 1

; Randomize components and textures on ped spawn (0 = always drawable 0 / texture 0 of the first skin tone)
RandomizeOnSpawn = 1

; Load additional peds1.txd - peds4.txd and ganghands.txd
LoadAdditionalPedsTxds = 1
